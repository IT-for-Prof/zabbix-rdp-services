zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
  templates:
    - uuid: 2a5c7c018a2f491394a494c1a34dc016
      template: 'Template App RDP Service'
      name: 'Template App RDP Service'
      groups:
        - name: Templates/Modules
      items:
        - uuid: 627245fbee5c4de0846d11af408615b3
          name: 'RDP service is running'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,{$RDP_PORT}]'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: 'SSH service'
          triggers:
            - uuid: e8a4a65a99444ee791288cdc0daa41f2
              expression: 'max(/Template App RDP Service/net.tcp.service[tcp,,{$RDP_PORT}],#3)=0'
              name: 'RDP service is down on {HOST.NAME}'
              priority: AVERAGE
      macros:
        - macro: '{$RDP_PORT}'
          value: '43389'
      valuemaps:
        - uuid: d807dfecd1ad4a378fdda2d3b0d804cf
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
