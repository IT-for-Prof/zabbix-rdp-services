[project]
name = "rdp-check"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=42.0,<50.0"]   # >=42: not_valid_*_utc accessors

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # asserts are expected in tests

[tool.mypy]
python_version = "3.12"
strict = true
